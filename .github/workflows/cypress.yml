name: QA Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: E2E tests (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Run Cypress
        uses: cypress-io/github-action@v7
        with:
          browser: chrome

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mochawesome-report
          path: mochawesome-report/index.html
          retention-days: 14

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
          retention-days: 7

  api:
    name: API tests (Bruno + ServeRest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CYPRESS_INSTALL_BINARY: 0 # this job does not need the Cypress binary

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start ServeRest
        run: |
          npm run api:server > serverest.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/usuarios > /dev/null && exit 0
            sleep 1
          done
          echo "ServeRest did not start"; cat serverest.log; exit 1

      - name: Run Bruno collection
        run: npm run api:test

      - name: Upload Bruno report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bruno-report
          path: bruno-report/index.html
          retention-days: 14
